<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lifecast</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
  <!--
    The page is drawn over the whole screen, and only the belt along the
    bottom and the small panel over it are opaque: the character stays
    visible in the rest of it, which is the point of editing live (D119, the
    LB structure - belt.js).
  -->
  <aside id="panel" class="panel">
    <header class="panel-header">
      <h1 class="panel-title">Lifecast</h1>
    </header>

    <!-- The categories of the belt, built by belt.js from groups.js. -->
    <nav id="belt" class="belt-cats" aria-label="Categories"></nav>

    <!--
      The character's name and the way out, always on screen (D129): the name
      is the character's identity, and the menu ends here. A plain text input
      on purpose: keyboard.js corrects the keyboard only for textarea and
      input of type text, search or none. The note floats above the belt -
      finish.js.
    -->
    <div id="toolbar" class="panel-toolbar">
      <div class="finish-row">
        <input id="finish-name" class="preset-field" type="text" spellcheck="false" autocomplete="off" placeholder="Name" aria-label="Name">
        <button id="finish-button" class="panel-button is-primary" type="button">Finish</button>
        <p id="finish-note" class="finish-note" hidden></p>
      </div>
    </div>

    <!--
      The small panel, over the belt's left end. Its head holds the chips of
      the open category's regions, or the row counter when more than one
      region shows (E2 item 5) - outside #sections, see belt.js.
    -->
    <div class="belt-panel">
      <!--
        Search and the "changed" filter (E2 items 3, 4; D129; moved here by
        F43): the top of the small panel, so it follows the panel when a menu
        changes its size, and exists only while the panel does (no category
        open, no field - F29). Outside #sections, because a tool for finding a
        slider is useless if it scrolls away with the sliders - search.js.
      -->
      <div id="finder" class="finder">
        <input id="search" class="preset-field" type="text" spellcheck="false" autocomplete="off" placeholder="Search sliders">
        <button id="filter-changed" class="panel-button" type="button" aria-pressed="false">Changed</button>
      </div>
      <div class="belt-head">
        <div id="regions" class="region-chips"></div>
        <span id="row-counter" class="versions"></span>
      </div>
      <main id="sections" class="panel-body">
        <p class="placeholder">No sections yet.</p>

        <!--
          The Debug section, under Settings (D132). finish.js wraps this into
          a section; the name and Finish moved to the belt (D129).
        -->
        <div id="finish">
          <!--
            The bridge to the DLL, and page, DLL and protocol versions: read
            when something is wrong. A bridge in trouble also marks the
            Settings button (D133) - panel.js.
          -->
          <span id="bridge-status" class="status status-wait">connecting</span>
          <span id="versions" class="versions"></span>
        </div>
      </main>
    </div>

    <footer class="panel-footer">
      <!--
        How big the panel is drawn, set by the player. It sits here, with the
        panel's own controls, because it is a property of the panel and not of
        the character - and it stays on screen, which a readability control
        has to.
      -->
      <div class="scale-group" aria-label="Panel size">
        <button id="scale-down" class="step-button" type="button" title="Smaller">-</button>
        <span id="scale-value" class="versions">100%</span>
        <button id="scale-up" class="step-button" type="button" title="Bigger">+</button>
      </div>
      <!--
        One of the two ways back to RaceMenu. The other is F4, which the DLL
        arms as the exit chord of the backend (Meridian or Prisma) and which works
        even when this page does not.
      -->
      <!--
        Settings (D132): debug and configuration, one category opened from
        here and not from the belt - belt.js, groups.js.
      -->
      <button id="settings-button" class="panel-button" type="button" data-cat="Settings">Settings</button>
      <button id="to-racemenu" class="panel-button is-primary" type="button" title="F4">RaceMenu (F4)</button>
    </footer>
  </aside>

  <!--
    The character view. Transparent: the character inside it is the game's
    own, placed here by the camera (stage.js, Panel/Stage in the DLL).
  -->
  <section id="stage" class="stage" aria-label="Character view">
    <p id="stage-note" class="stage-note"></p>
    <p id="stage-readout" class="stage-readout" hidden></p>
    <div id="stage-bar" class="stage-bar" hidden></div>
  </section>

  <!--
    Character Control (Undress, Light, Compare): always open and always on
    screen (D127), over the stage's lower left corner - outside #stage, so
    it is neither part of the drag nor hidden with the frame. control.js.
  -->
  <div id="control-bar" class="control-bar" aria-label="Character Control">
    <!--
      Here and not next to Finish (D130): a misclick on the way to undo must
      not end the menu.
      Undo and redo are buttons first (D130), and Ctrl+Z / Ctrl+Y / Ctrl+Shift+Z
      do the same (undokeys.js, 1.5 E4): Meridian delivers some key presses
      twice, ~15 ms apart, as fresh presses (measured in keyboard.js), and
      the shortcut drops the second one by key state, so a press is one step.
    -->
    <button id="undo" class="panel-button" type="button" title="Undo (Ctrl+Z)" disabled>Undo</button>
    <button id="redo" class="panel-button" type="button" title="Redo (Ctrl+Y)" disabled>Redo</button>
    <button id="undoall" class="panel-button" type="button" title="Undo all" disabled>Undo all</button>
    <span class="control-sep"></span>
  </div>

  <!--
    The card shown while RaceMenu's own film is in front and the panel is not:
    text only, no click - card.js.
  -->
  <div id="back-card" class="back-card" hidden></div>

  <script src="keyboard.js"></script>
  <script src="bridge.js"></script>
  <script src="settings.js"></script>
  <script src="history.js"></script>
  <script src="undokeys.js"></script>
  <script src="card.js"></script>
  <script src="panel.js"></script>
  <script src="controls.js"></script>
  <script src="search.js"></script>
  <script src="picker.js"></script>
  <script src="listpick.js"></script>
  <script src="look.js"></script>
  <script src="body.js"></script>
  <script src="tints.js"></script>
  <script src="overlays.js"></script>
  <script src="racepresets.js"></script>
  <script src="racesex.js"></script>
  <script src="sliders.js"></script>
  <script src="presets.js"></script>
  <script src="delegate.js"></script>
  <script src="finish.js"></script>
  <script src="control.js"></script>
  <script src="groups.js"></script>
  <script src="belt.js"></script>
  <script src="stage.js"></script>
  <script src="pad.js"></script>
</body>
</html>
